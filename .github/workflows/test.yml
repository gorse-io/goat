name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ubuntu:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install clang
        uses: ConorMacBride/install-package@v1
        with:
          apt: clang libc6-dev-i386
      - name: Install GOAT
        run: go install .
      - name: Run tests
        run: |
          goat tests/src/universal.c -o tests
          goat tests/src/o3.c -o tests -O3 -mavx
          go vet -C ./tests ./...
          go test -C ./tests -v

  arm:
    name: ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install clang
        uses: ConorMacBride/install-package@v1
        with:
          apt: clang
      - name: Install GOAT
        run: go install .
      - name: Run tests
        run: |
          goat tests/src/universal.c -o tests
          goat tests/src/o3.c -o tests -O3
          go vet -C ./tests ./...
          go test -C ./tests -v

  macos:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install clang and binutils
        run: brew install llvm binutils
      - name: Install GOAT
        run: go install .
      - name: Run tests
        run: |
          export PATH=/opt/homebrew/opt/llvm/bin:$PATH
          export PATH=/opt/homebrew/opt/binutils/bin:$PATH
          goat tests/src/universal.c -o tests
          goat tests/src/o3.c -o tests -O3
          go vet -C ./tests ./...
          go test -C ./tests -v

  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install LLVM and MinGW-w64
        uses: ConorMacBride/install-package@v1
        with:
          choco: llvm mingw
      - name: Install GOAT
        run: go install .
      - name: Run tests
        run: |
          goat tests/src/universal.c -o tests
          goat tests/src/o3.c -o tests -O3
          go vet -C ./tests ./...
          go test -C ./tests -v

  riscv:
    name: qemu-riscv64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install dependencies
        uses: ConorMacBride/install-package@v1
        with:
          apt: qemu-user-static clang binutils-riscv64-linux-gnu
      - name: Install GOAT
        run: go install .
      - name: Generate RISC-V assembly with GOAT
        env:
          OBJDUMP: /usr/bin/riscv64-linux-gnu-objdump
          CLANG: /usr/bin/clang
        run: |
          goat tests/src/universal.c -o tests --target riscv64 -march=rv64imafd
          goat tests/src/o3.c -o tests --target riscv64 -O3 -march=rv64imafd
      - name: Run tests with QEMU
        env:
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        run: |
          GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 go vet -C ./tests ./...
          cd tests
          GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 go test -c -o tests.test
          qemu-riscv64-static ./tests.test -test.v

  loong64:
    name: qemu-loong64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install dependencies
        uses: ConorMacBride/install-package@v1
        with:
          apt: qemu-user-static clang binutils-loongarch64-linux-gnu
      - name: Install GOAT
        run: go install .
      - name: Generate LoongArch assembly with GOAT
        run: |
          goat tests/src/universal.c -o tests --target loong64
          goat tests/src/o3.c -o tests --target loong64 -O3
      - name: Run tests with QEMU
        env:
          QEMU_LD_PREFIX: /usr/loongarch64-linux-gnu
        run: |
          GOOS=linux GOARCH=loong64 CGO_ENABLED=0 go vet -C ./tests ./...
          cd tests
          GOOS=linux GOARCH=loong64 CGO_ENABLED=0 go test -c -o tests.test
          qemu-loongarch64-static ./tests.test -test.v

  s390x:
    name: qemu-s390x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install dependencies
        uses: ConorMacBride/install-package@v1
        with:
          apt: qemu-user-static clang binutils-s390x-linux-gnu
      - name: Install GOAT
        run: go install .
      - name: Generate s390x assembly with GOAT
        run: |
          goat tests/src/universal.c -o tests --target s390x -e=-fzvector
          goat tests/src/o3.c -o tests --target s390x -O3 -e=-fzvector
      - name: Run tests with QEMU
        env:
          QEMU_LD_PREFIX: /usr/s390x-linux-gnu
        run: |
          GOOS=linux GOARCH=s390x CGO_ENABLED=0 go vet -C ./tests ./...
          cd tests
          GOOS=linux GOARCH=s390x CGO_ENABLED=0 go test -c -o tests.test
          qemu-s390x-static ./tests.test -test.v

  ppc64le:
    name: qemu-ppc64le
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/go.sum
      - name: Install dependencies
        uses: ConorMacBride/install-package@v1
        with:
          apt: qemu-user-static clang binutils-powerpc64le-linux-gnu gcc-powerpc64le-linux-gnu
      - name: Install GOAT
        run: go install .
      - name: Generate ppc64le assembly with GOAT
        run: |
          goat tests/src/universal.c -o tests --target ppc64le
          goat tests/src/o3.c -o tests --target ppc64le -O3
      - name: Run tests with QEMU
        env:
          QEMU_LD_PREFIX: /usr/powerpc64le-linux-gnu
        run: |
          GOOS=linux GOARCH=ppc64le CGO_ENABLED=0 go vet -C ./tests ./...
          cd tests
          GOOS=linux GOARCH=ppc64le CGO_ENABLED=0 go test -c -o tests.test
          qemu-ppc64le-static ./tests.test -test.v
